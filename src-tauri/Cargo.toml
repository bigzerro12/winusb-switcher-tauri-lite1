[package]
name = "jlink-winusb-switcher-lite"
version = "1.0.0"
description = "J-Link WinUSB Switcher — switch J-Link probes to WinUSB"
authors = ["J-Link WinUSB Switcher"]
edition = "2021"

[lib]
name = "winusb_switcher_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
ctrlc = "3"
thiserror = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
 


[profile.release]
opt-level = "s"   # optimize for size
strip = true
