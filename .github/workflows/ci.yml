name: CI

on:
  push:
    branches: [main, master, winusb-switcher-tauri-lite1]
  pull_request:
    branches: [main, master, winusb-switcher-tauri-lite1]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Validate version sync
        run: yarn check:version-sync
      - name: ESLint
        run: yarn lint
      - name: Frontend tests
        run: yarn test:run
      - name: Typecheck and build frontend
        run: yarn build

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies (Tauri/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --locked --no-fail-fast
      - name: Cargo build (release)
        run: cargo build --locked --release

  tauri-package-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies (Tauri/WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend
        run: yarn build
      - name: Build Tauri package (Linux deb smoke)
        run: yarn tauri:build -- --config src-tauri/tauri.conf.ci-prefrontend.json --bundles deb

  tauri-package-smoke-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend
        run: yarn build
      - name: Build Tauri package (Windows x64 smoke)
        run: yarn tauri:build -- --target x86_64-pc-windows-msvc
