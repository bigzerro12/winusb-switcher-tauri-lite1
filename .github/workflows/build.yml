# Tag + manual builds that publish one GitHub Release (Electron-style: build matrix → single release job).
# Does not replace ci.yml (PR / main smoke tests). Settings → Actions → Workflow permissions → Read and write.
name: Build J-Link WinUSB Switcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # One Vite build for both Linux targets (amd64 runner + i386 container cannot run Node 20).
  linux-frontend-dist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend (out/renderer)
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-frontend-dist
          path: out/renderer
          retention-days: 3

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          sharedKey: windows-${{ matrix.target }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (Windows ${{ matrix.target }})
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: yarn tauri:build -- --target ${{ matrix.target }}

      - name: Package portable .zip
        run: yarn package:portable -- --target ${{ matrix.target }}

      - name: SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-zips && sha256sum ./*.zip) | tee "SHA256SUMS-windows-${{ matrix.target }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-${{ matrix.target }}
          path: |
            release-zips/*.zip
            SHA256SUMS-windows-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: linux-frontend-dist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          sharedKey: linux-x86_64

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch prebuilt frontend
        uses: actions/download-artifact@v4
        with:
          name: linux-frontend-dist
          path: out/renderer

      - name: Build (Linux x86_64)
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: yarn tauri:build -- --config src-tauri/tauri.conf.ci-prefrontend.json

      - name: Package portable .zip
        run: yarn package:portable

      - name: SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-zips && sha256sum ./*.zip) | tee SHA256SUMS-linux-x86_64-unknown-linux-gnu.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-linux-x86_64-unknown-linux-gnu
          path: |
            release-zips/*.zip
            SHA256SUMS-linux-x86_64-unknown-linux-gnu.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all portable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true

      - name: Generate release checksums
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          : > SHA256SUMS.txt
          for f in **/*.zip; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          test -s SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            **/*.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
